# Render Blueprint for a PROTOTYPE deployment (free web service + free Postgres).
# - The free web service sleeps after 15 minutes without traffic (about a minute to wake).
# - The free Postgres expires 30 days after creation and is deleted 14 days later.
# - NODE_ENV is set to "staging" on purpose: Render defaults Node services to "production",
#   and production start-up refuses to run without the Vonage and Tavily settings.
#   Staging skips that check, so sends fail until Vonage is configured. Session cookies are
#   not marked Secure outside production. Do not enroll real people on this deployment.
databases:
  - name: nyc-alerts-db
    plan: free
    databaseName: alerts
    user: alerts
    # Open so you can run `create-admin` once from your own computer (the free web service has
    # no shell). After creating the admin, close it in the Render dashboard (Networking).
    ipAllowList:
      - source: 0.0.0.0/0
        description: temporary, for create-admin

services:
  - type: web
    name: nyc-food-shelter-alerts
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: nyc-alerts-db
          property: connectionString
      - key: PHONE_ENCRYPTION_KEY
        generateValue: true
      - key: PHONE_HASH_KEY
        generateValue: true
      # Paste these in the Render dashboard (never commit them):
      - key: TAVILY_API_KEY
        sync: false
      - key: VONAGE_SIGNATURE_SECRET
        sync: false
